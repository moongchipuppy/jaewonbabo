<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="glass-panel main-header">
            <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
                <h1>📚 AI Study Assistant <span style="font-size: 0.8rem; background: var(--primary); padding: 0.2rem 0.6rem; border-radius: 12px; vertical-align: middle;">DEMO</span></h1>
                <a href="vocab.html" style="text-decoration: none; background: rgba(255,255,255,0.1); color: white; padding: 0.5rem 1rem; border-radius: 8px; font-weight: 500; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.2); transition: all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.2)'" onmouseout="this.style.background='rgba(255,255,255,0.1)'">📖 단어 암기 기능</a>
            </div>
            <div class="api-key-container" style="display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-end;">
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <span style="font-size: 0.9rem; color: var(--text-secondary);">AI 모델 선택:</span>
                    <select id="ai-provider" style="background: rgba(15, 23, 42, 0.6); border: 1px solid var(--panel-border); color: white; padding: 0.6rem; border-radius: 8px; outline: none;">
                        <option value="gemini">Google Gemini 3.0</option>
                        <option value="openai">OpenAI (ChatGPT)</option>
                    </select>
                </div>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <input type="password" id="api-key-input" value="AIzaSyAB-KXvn4rYu2u6N-52JlDCDSnV2DTPIJ4" placeholder="API 키 입력 (선택한 모델용)" style="background: rgba(15, 23, 42, 0.6); border: 1px solid var(--panel-border); color: white; padding: 0.6rem; border-radius: 8px; outline: none;" />
                </div>
            </div>
        </header>

        <main class="content-area">
            <section class="glass-panel upload-section" id="upload-section">
                <h2>1. 자료 업로드</h2>
                <p>PDF 또는 오디오 파일(mp3, wav)을 업로드하여 웹 브라우저 자체에서 텍스트를 추출하고, 요약본과 퀴즈를 생성해보세요!</p>
                <div class="file-upload-wrapper">
                    <input type="file" id="file-input" accept=".pdf, .mp3, .wav, .m4a" />
                    <label for="file-input" class="upload-btn">파일 선택</label>
                    <span id="file-name">선택된 파일 없음</span>
                </div>
                <button id="extract-btn" disabled>텍스트 추출 및 요약하기</button>
                <div id="loading-indicator" class="hidden loading-container">
                    <div class="spinner"></div>
                    <span id="loading-text">처리 중...</span>
                </div>
            </section>

            <section class="glass-panel results-section hidden" id="results-section">
                <h2>2. AI 요약</h2>
                <div class="tabs">
                    <button class="tab-btn active" data-tab="summary">요약본</button>
                    <button class="tab-btn" data-tab="extracted-text">추출된 텍스트</button>
                </div>
                
                <div class="tab-content active" id="tab-summary">
                    <div id="summary-content" class="markdown-body"></div>
                </div>
                
                <div class="tab-content" id="tab-extracted-text">
                    <textarea id="extracted-text-area" readonly></textarea>
                </div>
                
                <div class="quiz-generator-container mt-4">
                    <h2>3. 퀴즈 생성기</h2>
                    <div class="quiz-options">
                        <label><input type="radio" name="quiz-type" value="객관식(Multiple Choice)" checked> 객관식</label>
                        <label><input type="radio" name="quiz-type" value="주관식 단답형(Short Answer)"> 주관식 단답형</label>
                        <label><input type="radio" name="quiz-type" value="O/X 맞추기(True / False)"> O/X 맞추기</label>
                    </div>
                    <button id="generate-quiz-btn">퀴즈 생성하기</button>
                </div>
                
                <div id="quiz-loading" class="hidden loading-container mt-4">
                    <div class="spinner"></div>
                    <span>퀴즈를 생성하는 중...</span>
                </div>
                
                <div id="quiz-content-container" class="hidden mt-4">
                    <h3>생성된 퀴즈</h3>
                    <div id="quiz-content" class="markdown-body"></div>
                </div>
            </section>
        </main>
    </div>
    
    <div id="toast"></div>
    <script src="script.js?v=202404071348"></script>
</body>
</html>
